<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lcpDiagTitleEn">
  <title id="lcpDiagTitleEn">Two leadership domains: creative and reactive</title>

  <circle cx="280" cy="240" r="190" fill="none" stroke="#d8d4cb" stroke-width="1"/>

  <path d="M 90 240 A 190 190 0 0 1 470 240 L 280 240 Z" fill="#B08D57" fill-opacity="0.14"/>
  <path d="M 90 240 A 190 190 0 0 0 470 240 L 280 240 Z" fill="#0B2545" fill-opacity="0.08"/>

  <line x1="90" y1="240" x2="470" y2="240" stroke="#0B2545" stroke-width="1" stroke-opacity="0.35"/>

  <circle cx="280" cy="240" r="52" fill="#F5F3EE" stroke="#B08D57" stroke-width="1.4"/>
  <text x="280" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#0B2545" font-weight="700">IDENTITY</text>

  <g stroke="#0B2545" stroke-opacity="0.18" stroke-width="1">
    <line x1="280" y1="50" x2="280" y2="80"/>
    <line x1="152" y1="90" x2="170" y2="112"/>
    <line x1="408" y1="90" x2="390" y2="112"/>
    <line x1="97" y1="180" x2="123" y2="192"/>
    <line x1="463" y1="180" x2="437" y2="192"/>
    <line x1="97" y1="300" x2="123" y2="288"/>
    <line x1="463" y1="300" x2="437" y2="288"/>
    <line x1="152" y1="390" x2="170" y2="368"/>
    <line x1="408" y1="390" x2="390" y2="368"/>
    <line x1="280" y1="430" x2="280" y2="400"/>
  </g>

  <text x="280" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2.5" fill="#B08D57" font-weight="700">CREATIVE</text>

  <text x="280" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2.5" fill="#0B2545" font-weight="700">REACTIVE</text>

  <text x="60" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#6b7280" transform="rotate(-90 60 245)">RELATIONSHIPS</text>
  <text x="500" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#6b7280" transform="rotate(90 500 245)">RESULTS</text>

  <text x="280" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#4b5563">Sustains results and relationships at once</text>
  <text x="280" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#9ca3af">Sustains one at the expense of the other, under pressure</text>
</svg>
