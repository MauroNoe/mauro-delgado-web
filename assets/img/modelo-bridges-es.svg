<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#FFFFFF"/>

  <line x1="110" y1="70" x2="610" y2="70" stroke="#e3e2df" stroke-width="2"/>

  <circle cx="110" cy="70" r="40" fill="#F5F3EE" stroke="#B08D57" stroke-width="2"/>
  <text x="110" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#0B2545">FINAL</text>
  <text x="110" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">Soltar</text>
  <text x="110" y="157" text-anchor="middle" font-size="11" fill="#5b6472">Ira, miedo,</text>
  <text x="110" y="173" text-anchor="middle" font-size="11" fill="#5b6472">tristeza</text>

  <circle cx="360" cy="70" r="40" fill="#0B2545"/>
  <text x="360" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">ZONA</text>
  <text x="360" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">NEUTRAL</text>
  <text x="360" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">El intermedio</text>
  <text x="360" y="157" text-anchor="middle" font-size="11" fill="#5b6472">Confusión, apatía,</text>
  <text x="360" y="173" text-anchor="middle" font-size="11" fill="#5b6472">baja productividad</text>

  <circle cx="610" cy="70" r="40" fill="#B08D57"/>
  <text x="610" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">NUEVO</text>
  <text x="610" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">COMIENZO</text>
  <text x="610" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">Recompromiso</text>
  <text x="610" y="157" text-anchor="middle" font-size="11" fill="#5b6472">Energía,</text>
  <text x="610" y="173" text-anchor="middle" font-size="11" fill="#5b6472">motivación</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#8b93a1" font-style="italic">Modelo de Transición de William Bridges</text>
