<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#FFFFFF"/>

  <line x1="90" y1="70" x2="630" y2="70" stroke="#e3e2df" stroke-width="2"/>

  <circle cx="90" cy="70" r="34" fill="#F5F3EE" stroke="#B08D57" stroke-width="2"/>
  <text x="90" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#0B2545">1</text>
  <text x="90" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">FORMACIÓN</text>
  <text x="90" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Incertidumbre,</text>
  <text x="90" y="168" text-anchor="middle" font-size="11" fill="#5b6472">necesidad de estructura</text>

  <circle cx="270" cy="70" r="34" fill="#0B2545"/>
  <text x="270" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="270" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">TORMENTA</text>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Emergen conflicto</text>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#5b6472">y diferencias</text>

  <circle cx="450" cy="70" r="34" fill="#0B2545"/>
  <text x="450" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="450" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">NORMALIZACIÓN</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Cohesión, confianza,</text>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#5b6472">roles asentados</text>

  <circle cx="630" cy="70" r="34" fill="#B08D57"/>
  <text x="630" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="630" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">DESEMPEÑO</text>
  <text x="630" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Autonomía real,</text>
  <text x="630" y="168" text-anchor="middle" font-size="11" fill="#5b6472">resultados sostenidos</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#8b93a1" font-style="italic">Etapas de desarrollo de equipos de Bruce Tuckman (1965)</text>
</svg>
