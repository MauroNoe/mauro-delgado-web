<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#FFFFFF"/>

  <line x1="110" y1="70" x2="610" y2="70" stroke="#e3e2df" stroke-width="2"/>

  <circle cx="110" cy="70" r="40" fill="#F5F3EE" stroke="#B08D57" stroke-width="2"/>
  <text x="110" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#0B2545">ENDING</text>
  <text x="110" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">Letting go</text>
  <text x="110" y="157" text-anchor="middle" font-size="11" fill="#5b6472">Anger, fear,</text>
  <text x="110" y="173" text-anchor="middle" font-size="11" fill="#5b6472">sadness</text>

  <circle cx="360" cy="70" r="40" fill="#0B2545"/>
  <text x="360" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">NEUTRAL</text>
  <text x="360" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ZONE</text>
  <text x="360" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">The in-between</text>
  <text x="360" y="157" text-anchor="middle" font-size="11" fill="#5b6472">Confusion, apathy,</text>
  <text x="360" y="173" text-anchor="middle" font-size="11" fill="#5b6472">low productivity</text>

  <circle cx="610" cy="70" r="40" fill="#B08D57"/>
  <text x="610" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">NEW</text>
  <text x="610" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">BEGINNING</text>
  <text x="610" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">Recommitment</text>
  <text x="610" y="157" text-anchor="middle" font-size="11" fill="#5b6472">Energy,</text>
  <text x="610" y="173" text-anchor="middle" font-size="11" fill="#5b6472">motivation</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#8b93a1" font-style="italic">William Bridges' Transition Model</text>
</svg>
