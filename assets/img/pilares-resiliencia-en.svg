<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="600" height="300" fill="#FFFFFF"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#0B2545">THREE PILLARS OF RESILIENCE</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="30" y="60" width="160" height="170" rx="6" fill="#0B2545"/>
    <text x="110" y="115" fill="#FFFFFF">Facing</text>
    <text x="110" y="135" fill="#FFFFFF">Reality</text>
    <text x="110" y="165" font-size="11" font-weight="400" fill="#cba876">A clear-eyed read</text>
    <text x="110" y="182" font-size="11" font-weight="400" fill="#cba876">of what's actually</text>
    <text x="110" y="199" font-size="11" font-weight="400" fill="#cba876">happening</text>

    <rect x="220" y="60" width="160" height="170" rx="6" fill="#B08D57"/>
    <text x="300" y="115" fill="#FFFFFF">Finding</text>
    <text x="300" y="135" fill="#FFFFFF">Meaning</text>
    <text x="300" y="165" font-size="11" font-weight="400" fill="#0B2545">A reason strong</text>
    <text x="300" y="182" font-size="11" font-weight="400" fill="#0B2545">enough to keep</text>
    <text x="300" y="199" font-size="11" font-weight="400" fill="#0B2545">going</text>

    <rect x="410" y="60" width="160" height="170" rx="6" fill="#173B6B"/>
    <text x="490" y="115" fill="#FFFFFF">Improvising</text>
    <text x="490" y="165" font-size="11" font-weight="400" fill="#cba876">Adapting with what's</text>
    <text x="490" y="182" font-size="11" font-weight="400" fill="#cba876">actually available,</text>
    <text x="490" y="199" font-size="11" font-weight="400" fill="#cba876">not what's ideal</text>
  </g>

  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#5b6472">Adapted from Diane Coutu's resilience research, Harvard Business Review.</text>
</svg>
