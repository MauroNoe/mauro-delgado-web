<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="560" height="420" fill="#FFFFFF"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#0B2545">CUATRO COMPETENCIAS DEL LÍDER CON INTELIGENCIA DE CONFLICTO</text>

  <g transform="translate(60,55)">
    <rect x="0" y="0" width="200" height="150" fill="#F5F3EE" stroke="#e3e2df"/>
    <text x="100" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#0B2545">Autoconciencia y</text>
    <text x="100" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#0B2545">Autorregulación</text>
    <text x="100" y="112" text-anchor="middle" font-size="11" fill="#5b6472">Mantener calma y estrategia</text>

    <rect x="220" y="0" width="200" height="150" fill="#0B2545"/>
    <text x="320" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Habilidad Social</text>
    <text x="320" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">de Conflicto</text>
    <text x="320" y="112" text-anchor="middle" font-size="11" fill="#cba876">Escuchar y revisar el sesgo</text>

    <rect x="0" y="170" width="200" height="150" fill="#0B2545"/>
    <text x="100" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Adaptabilidad</text>
    <text x="100" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Situacional</text>
    <text x="100" y="282" text-anchor="middle" font-size="11" fill="#cba876">Ajustar el enfoque al contexto</text>

    <rect x="220" y="170" width="200" height="150" fill="#F5F3EE" stroke="#e3e2df"/>
    <text x="320" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#0B2545">Sabiduría</text>
    <text x="320" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#0B2545">Sistémica</text>
    <text x="320" y="282" text-anchor="middle" font-size="11" fill="#5b6472">Ver las fuerzas más amplias</text>
  </g>

  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#5b6472">Adaptado de la investigación de Peter T. Coleman sobre Inteligencia de Conflicto (CIQ), HBR 2025.</text>
</svg>
