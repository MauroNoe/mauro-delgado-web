<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lcpDiagTitle">
  <title id="lcpDiagTitle">Dos dominios de liderazgo: creativo y reactivo</title>

  <!-- outer ring -->
  <circle cx="280" cy="240" r="190" fill="none" stroke="#d8d4cb" stroke-width="1"/>

  <!-- top half: creative -->
  <path d="M 90 240 A 190 190 0 0 1 470 240 L 280 240 Z" fill="#B08D57" fill-opacity="0.14"/>
  <!-- bottom half: reactive -->
  <path d="M 90 240 A 190 190 0 0 0 470 240 L 280 240 Z" fill="#0B2545" fill-opacity="0.08"/>

  <!-- divider -->
  <line x1="90" y1="240" x2="470" y2="240" stroke="#0B2545" stroke-width="1" stroke-opacity="0.35"/>

  <!-- inner circle: identity -->
  <circle cx="280" cy="240" r="52" fill="#F5F3EE" stroke="#B08D57" stroke-width="1.4"/>
  <text x="280" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#0B2545" font-weight="700">IDENTIDAD</text>

  <!-- arcs of dashes suggesting dimensions, generic (not a literal reproduction of any proprietary wheel) -->
  <g stroke="#0B2545" stroke-opacity="0.18" stroke-width="1">
    <line x1="280" y1="50" x2="280" y2="80"/>
    <line x1="152" y1="90" x2="170" y2="112"/>
    <line x1="408" y1="90" x2="390" y2="112"/>
    <line x1="97" y1="180" x2="123" y2="192"/>
    <line x1="463" y1="180" x2="437" y2="192"/>
    <line x1="97" y1="300" x2="123" y2="288"/>
    <line x1="463" y1="300" x2="437" y2="288"/>
    <line x1="152" y1="390" x2="170" y2="368"/>
    <line x1="408" y1="390" x2="390" y2="368"/>
    <line x1="280" y1="430" x2="280" y2="400"/>
  </g>

  <!-- top label -->
  <text x="280" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2.5" fill="#B08D57" font-weight="700">CREATIVO</text>

  <!-- bottom label -->
  <text x="280" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2.5" fill="#0B2545" font-weight="700">REACTIVO</text>

  <!-- side labels -->
  <text x="60" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#6b7280" transform="rotate(-90 60 245)">RELACIONES</text>
  <text x="500" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#6b7280" transform="rotate(90 500 245)">RESULTADOS</text>

  <!-- captions -->
  <text x="280" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#4b5563">Sostiene resultados y relaciones a la vez</text>
  <text x="280" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#9ca3af">Sostiene uno a costa del otro, bajo presión</text>
</svg>
