<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="600" height="300" fill="#FFFFFF"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#0B2545">TRES PILARES DE LA RESILIENCIA</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="30" y="60" width="160" height="170" rx="6" fill="#0B2545"/>
    <text x="110" y="115" fill="#FFFFFF">Aceptar la</text>
    <text x="110" y="135" fill="#FFFFFF">Realidad</text>
    <text x="110" y="165" font-size="11" font-weight="400" fill="#cba876">Una lectura clara</text>
    <text x="110" y="182" font-size="11" font-weight="400" fill="#cba876">de lo que está</text>
    <text x="110" y="199" font-size="11" font-weight="400" fill="#cba876">pasando de verdad</text>

    <rect x="220" y="60" width="160" height="170" rx="6" fill="#B08D57"/>
    <text x="300" y="115" fill="#FFFFFF">Encontrar</text>
    <text x="300" y="135" fill="#FFFFFF">Sentido</text>
    <text x="300" y="165" font-size="11" font-weight="400" fill="#0B2545">Una razón lo</text>
    <text x="300" y="182" font-size="11" font-weight="400" fill="#0B2545">bastante fuerte</text>
    <text x="300" y="199" font-size="11" font-weight="400" fill="#0B2545">para seguir</text>

    <rect x="410" y="60" width="160" height="170" rx="6" fill="#173B6B"/>
    <text x="490" y="115" fill="#FFFFFF">Improvisar</text>
    <text x="490" y="165" font-size="11" font-weight="400" fill="#cba876">Adaptarse con lo</text>
    <text x="490" y="182" font-size="11" font-weight="400" fill="#cba876">que hay disponible,</text>
    <text x="490" y="199" font-size="11" font-weight="400" fill="#cba876">no con lo ideal</text>
  </g>

  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#5b6472">Adaptado de la investigación de Diane Coutu sobre resiliencia, Harvard Business Review.</text>
</svg>
