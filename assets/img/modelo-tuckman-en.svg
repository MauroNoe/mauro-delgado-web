<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#FFFFFF"/>

  <!-- connecting line -->
  <line x1="90" y1="70" x2="630" y2="70" stroke="#e3e2df" stroke-width="2"/>

  <!-- Stage 1: Forming -->
  <circle cx="90" cy="70" r="34" fill="#F5F3EE" stroke="#B08D57" stroke-width="2"/>
  <text x="90" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#0B2545">1</text>
  <text x="90" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">FORMING</text>
  <text x="90" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Uncertainty,</text>
  <text x="90" y="168" text-anchor="middle" font-size="11" fill="#5b6472">need for structure</text>

  <!-- Stage 2: Storming -->
  <circle cx="270" cy="70" r="34" fill="#0B2545"/>
  <text x="270" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="270" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">STORMING</text>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Conflict and</text>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#5b6472">differences emerge</text>

  <!-- Stage 3: Norming -->
  <circle cx="450" cy="70" r="34" fill="#0B2545"/>
  <text x="450" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="450" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">NORMING</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Cohesion, trust,</text>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#5b6472">roles take hold</text>

  <!-- Stage 4: Performing -->
  <circle cx="630" cy="70" r="34" fill="#B08D57"/>
  <text x="630" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="630" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">PERFORMING</text>
  <text x="630" y="152" text-anchor="middle" font-size="11" fill="#5b6472">Real autonomy,</text>
  <text x="630" y="168" text-anchor="middle" font-size="11" fill="#5b6472">sustained results</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#8b93a1" font-style="italic">Bruce Tuckman's stages of group development (1965)</text>
</svg>
